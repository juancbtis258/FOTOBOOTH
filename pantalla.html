<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Slideshow | Zoe Creaciones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #000; overflow: hidden; }
    .fade-transition { transition: opacity 1s ease-in-out; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center relative p-6">

  <!-- Header Flotante -->
  <div class="absolute top-6 left-6 z-20 flex items-center gap-3 bg-black/60 backdrop-blur-md px-6 py-3 rounded-full border border-white/10">
    <div class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></div>
    <span id="evento-nombre" class="text-white font-bold tracking-widest text-lg uppercase">EVENTO</span>
  </div>

  <!-- Contenedor Principal del Slider -->
  <div class="h-full w-full flex items-center justify-center">
    <img id="slider-img" src="" class="max-h-[90vh] max-w-[90vw] object-contain rounded-2xl shadow-2xl fade-transition opacity-0">
  </div>

  <script>
    const SUPABASE_URL = 'https://ugtpsdcjeirfozzggorq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVndHBzZGNqZWlyZm96emdnb3JxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MTY3NzksImV4cCI6MjEwNjA5Mjc3OX0.PiErdyg2S8Be_gwpGRg_jBBrnn2lcqehVc5ITXYO1z8';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const params = new URLSearchParams(window.location.search);
    const nombreEvento = (params.get('evento') || 'prueba').toLowerCase().trim();
    document.getElementById('evento-nombre').innerText = nombreEvento.replace(/-/g, ' ');

    let listaFotos = [];
    let indiceActual = 0;

    async function obtenerFotos() {
      const { data } = await _supabase
        .from('fotos')
        .select('url_foto')
        .eq('evento_id', nombreEvento)
        .order('id', { ascending: false });

      if (data && data.length > 0) {
        listaFotos = data.map(d => d.url_foto);
      }
    }

    function cambiarImagen() {
      if (listaFotos.length === 0) return;
      const img = document.getElementById('slider-img');
      img.style.opacity = '0';

      setTimeout(() => {
        img.src = listaFotos[indiceActual];
        img.style.opacity = '1';
        indiceActual = (indiceActual + 1) % listaFotos.length;
      }, 1000);
    }

    // Recargar fotos cada 10 segundos y rotar cada 5 segundos
    obtenerFotos().then(() => cambiarImagen());
    setInterval(cambiarImagen, 5000);
    setInterval(obtenerFotos, 10000);
  </script>
</body>
</html>
